<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./stylings/bootstrap.css" />
    <title>Inserting data into a db</title>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 bg-light p-4 rounded shadow-sm">
          <h2 class="row justify-content-center">Add a New Product</h2>
          <form action="http://localhost:3001/addproducts" method="POST">
            <!-- Product ID Field (Auto-generated) -->
            <div class="mb-3">
              <label for="product_id" class="form-label">Product ID</label>
              <input
                type="number"
                class="form-control"
                id="product_id"
                name="Product_ID"
                placeholder="(Auto-generated)"
                readonly
              />
            </div>

            <div class="mb-3">
              <label for="product_url" class="form-label">Product URL</label>
              <input
                type="url"
                class="form-control"
                id="product_url"
                name="Product_url"
                placeholder="Enter Product URL"
                required
              />
            </div>

            <div class="mb-3">
              <label for="product_name" class="form-label">Product Name</label>
              <input
                type="text"
                class="form-control"
                id="product_name"
                name="Product_name"
                placeholder="Enter Product Name"
                required
              />
            </div>

            <div class="mb-3">
              <label for="product_description" class="form-label"
                >Product Description</label
              >
              <input
                type="text"
                class="form-control"
                id="product_description"
                name="Product_brief_description"
                placeholder="Enter Brief Description"
              />
            </div>

            <div class="mb-3">
              <label for="" class="form-label"
                >Link destination</label
              >
              <input
                type="text"
                class="form-control"
                id="product_link"
                name="Product_link"
                placeholder="Enter Product Link"
              />
            </div>

            <div class="mb-3">
              <label for="" class="form-label"
                >Image</label
              >
              <input
                type="text"
                class="form-control"
                id="product_img"
                name="Product_img"
                placeholder="Enter Image Link"
              />
            </div>

            <div class="mb-3">
              <label for="starting_price" class="form-label"
                >Price</label
              >
              <input
                type="text"
                class="form-control"
                id="starting_price"
                name="Starting_price"
                placeholder="Enter Starting Price"
              />
            </div>

            <div class="mb-3">
              <label for=" " class="form-label">Monthly Plan</label>
              <input
                type="text"
                class="form-control"
                id="price_range"
                name="Price_range"
                placeholder="Enter Price Range"
              />
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">Add Product</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS (Optional, for extra functionality like tooltips, popovers, etc.) -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      integrity="sha384-oBqDVmMz4fnFO9gybB4vfxzVd6j9D2oJvY6+2qMdy7qK9x8ttEFi1mLk8wBzY1pR"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
      integrity="sha384-pzjw8f+ua7Kw1TIq0x3I0ou+v+qBKmOOJfktn0vsFiLXM5iSmYQz90euk/dp6GgA"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
